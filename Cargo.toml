#:schema https://www.schemastore.org/cargo.json

[workspace]
resolver = "3"
members  = ["crates/kernel", "crates/user"]

[workspace.package]
version    = "0.1.0"
edition    = "2024"
repository = "https://github.com/princemuel/ravenos"
license    = "MIT OR Apache-2.0"
publish    = false

[workspace.dependencies]
############################
eros   = "0.7"
log    = "0.4"
riscv  = "0.16"
sbi-rt = "0.0.4"
spin   = "0.12"

[workspace.lints.clippy]
all         = { level = "warn", priority = -1 }
pedantic    = { level = "warn", priority = -1 }
restriction = { level = "warn", priority = -1 }

# ___ Allowed (too noisy / not applicable) ___
arbitrary_source_item_ordering = "allow"
expect_used                    = "allow"
implicit_return                = "allow"  # redundant
let_underscore_untyped         = "allow"
missing_docs_in_private_items  = "allow"  # uncomment if it gets annoying
missing_errors_doc             = "allow"
missing_panics_doc             = "allow"
missing_trait_methods          = "allow"
pub_with_shorthand             = "allow"  # redundant
single_call_fn                 = "allow"
unseparated_literal_suffix     = "allow"
# module_name_repetitions    = "allow"  # uncomment if it gets annoying
# panic                      = "allow"  # uncomment if you use panic! intentionally
# std_instead_of_alloc       = "allow"  # uncomment if you add alloc later
# implicit_return            = "allow"  # restriction lint, very noisy in Rust style

# ___ Escalate the ones you care most about ___
default_union_representation   = "deny"
empty_drop                     = "deny"
missing_asserts_for_indexing   = "deny"
mixed_read_write_in_expression = "deny"
panic_in_result_fn             = "deny"

[workspace.lints.rust]
# ___ Lint groups ___
future_incompatible                        = { level = "warn", priority = -1 }
nonstandard_style                          = { level = "warn", priority = -1 }
rust_2018_idioms                           = { level = "warn", priority = -1 }
unknown_or_malformed_diagnostic_attributes = { level = "warn", priority = -1 }
unused                                     = { level = "warn", priority = -1 }

# ___ Undefined / unsafe behaviour ___
ffi_unwind_calls       = "deny"  # C function unwinds into Rust = instant UB
keyword_idents_2024    = "deny"
non_ascii_idents       = "deny"  # homoglyph attacks (Cyrillic 'а' vs ASCII 'a')
unsafe_op_in_unsafe_fn = "deny"  # forces explicit unsafe {} blocks inside unsafe fn

# ___ API / interface correctness ___
macro_use_extern_crate       = "deny"  # use explicit `use crate::macro` instead
meta_variable_misuse         = "deny"  # malformed macro_rules! metavariables
missing_copy_implementations = "warn"  # reminder to derive Copy where trivially safe
# missing_docs               = "warn"  # uncomment when the project matures
redundant_imports            = "deny"
unnameable_types             = "warn"
unreachable_pub              = "warn"

# ___ Type system / lifetime hygiene ___
ambiguous_negative_literals   = "warn"  # -1i32.abs() is parsed as _(1i32.abs()), not (-1i32).abs()
deref_into_dyn_supertrait     = "warn"  # &dyn Sub deref'd to &dyn Super. subtle dispatch change
impl_trait_redundant_captures = "warn"
redundant_lifetimes           = "deny"
single_use_lifetimes          = "deny"
trivial_casts                 = "deny"
trivial_numeric_casts         = "deny"
unit_bindings                 = "deny"
unused_import_braces          = "deny"
unused_lifetimes              = "warn"
unused_qualifications         = "deny"
unused_results                = "warn"

# ___ Drop / resource safety ___
let_underscore_drop = "warn"

# ___ Style / future compatibility ___
closure_returning_async_block = "warn"
keyword_idents_2018           = "warn"

# ___ Uncomment when ready ___
# missing_docs              = "warn"   # enable once public API stabilises
# unsafe_code               = "warn"   # enable/disable per project
# unused_crate_dependencies = "warn"   # enable per_crate, noisy with dev_dependencies

[profile.bench]
opt-level     = 3
debug         = false
lto           = true
codegen-units = 1

# cargo build/run
[profile.dev]
# default is opt_level = '0', but that makes very verbose machine code
opt-level     = "s"
# trade compile speed for slightly better optimisations
codegen-units = 1

# cargo build/run --release
[profile.release]
# default is opt-level = '3', but that makes quite verbose machine code
opt-level     = "s"
# Leave the debug symbols in (default is no debug info)
debug         = 2
# Use Link Time Optimisations to further inline things across
# crates
lto           = "fat"
# trade compile speed for slightly better optimisations
codegen-units = 1
